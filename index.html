<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{nombre}}</title>
  <meta name="description" content="{{descripcion}}" />
  <link rel="canonical" href="{{dominio}}/">

  <!-- Open Graph / redes sociales (WhatsApp, Facebook, Instagram...). La web
       es una SPA sin renderizado en servidor, así que estas etiquetas son
       las mismas para cualquier URL del sitio — no hay vista previa
       específica por torneo/noticia sin añadir renderizado en servidor.
       Los marcadores entre dobles llaves los rellena vite.config.js con los
       datos de club.config.js. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{nombre}}">
  <meta property="og:title" content="{{nombre}}">
  <meta property="og:description" content="{{descripcionRedes}}">
  <meta property="og:url" content="{{dominio}}/">
  <meta property="og:image" content="{{imagenes.redes}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{nombre}}">
  <meta name="twitter:description" content="{{descripcionRedes}}">
  <meta name="twitter:image" content="{{imagenes.redes}}">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="{{imagenes.favicon.ico}}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{imagenes.favicon.png16}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{imagenes.favicon.png32}}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{imagenes.favicon.apple}}">
  <meta name="theme-color" content="{{colorTema}}">
</head>
<body>
  <div id="root"></div>
  <script src="/club-config.js"></script>
  <script src="/push-token-db.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
